name: codex-auto-fix
# Codex 自动修复 Pipeline
# 当 CI 失败时，自动尝试修复常见问题

on:
  workflow_run:
    workflows: ["ci", "codex-review"]
    types: [completed]
    branches-ignore: [main]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_FIX_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download failure logs
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run_id = context.payload.workflow_run.id;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id
            });
            
            let failedJobs = [];
            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                failedJobs.push({
                  name: job.name,
                  id: job.id
                });
              }
            }
            
            console.log('Failed jobs:', JSON.stringify(failedJobs, null, 2));
            fs.writeFileSync('/tmp/failure_logs.txt', '');
            
            // 下载日志
            for (const job of failedJobs) {
              try {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id
                });
                const content = typeof logs.data === 'string'
                  ? logs.data
                  : Buffer.from(logs.data).toString('utf8');
                fs.appendFileSync('/tmp/failure_logs.txt', `\n\n===== ${job.name} (${job.id}) =====\n\n`);
                fs.appendFileSync('/tmp/failure_logs.txt', content);
                console.log(`Job ${job.name} logs downloaded`);
              } catch (e) {
                console.log(`Failed to download logs for ${job.name}: ${e.message}`);
              }
            }
            core.setOutput('failed_job_count', failedJobs.length.toString());

      - name: Attempt auto-fix
        id: auto-fix
        run: |
          echo "🔧 Analyzing failure and attempting auto-fix..."
          echo "applied=false" >> "$GITHUB_OUTPUT"
          
          # 检查是否是 lint/format 问题
          if grep -q "ruff" /tmp/failure_logs.txt 2>/dev/null || grep -q "format" /tmp/failure_logs.txt 2>/dev/null; then
            echo "Lint/format issue detected. Attempting fix..."
            
            # 安装依赖
            pip install ruff
            
            # 自动修复
            ruff check --fix dimos/ tests/ scripts/ || true
            ruff format dimos/ tests/ scripts/
            
            # 提交修复
            git config user.name "codex-auto-fix[bot]"
            git config user.email "codex-auto-fix[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No auto-fixable changes were produced."
            else
              git commit -m "style: auto-fix lint/format issues"
              git push
              echo "applied=true" >> "$GITHUB_OUTPUT"
            fi
            
          else
            echo "⚠️ Cannot auto-fix this failure. Manual intervention required."
          fi

      - name: Post auto-fix status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            if (!prNumber) {
              console.log('No PR found for this workflow run');
              return;
            }
            
            const applied = '${{ steps.auto-fix.outputs.applied }}' === 'true';
            const body = applied
              ? '✅ **Auto-fix applied**: Lint/format issues were automatically fixed and committed.'
              : '⚠️ **Auto-fix not applied**: This failure was not recognized as an auto-fixable lint/format issue, or no changes were produced.';
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
