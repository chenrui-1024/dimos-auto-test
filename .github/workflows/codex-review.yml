name: codex-review
# Codex 代码审查 Pipeline
# 触发条件：PR 创建/更新、或手动触发
# 功能：安全扫描 + 代码质量 + Hermes Review 触发

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'dimos/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (optional)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  review-context:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.context.outputs.pr_number }}
      base-ref: ${{ steps.context.outputs.base_ref }}
      head-ref: ${{ steps.context.outputs.head_ref }}
      head-sha: ${{ steps.context.outputs.head_sha }}
      review-url: ${{ steps.context.outputs.review_url }}
    steps:
      - name: Resolve PR context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            let pr;
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
            } else {
              const prNumber = '${{ github.event.inputs.pr_number }}';
              if (!prNumber) {
                core.setFailed('workflow_dispatch requires the pr_number input.');
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              pr = response.data;
            }

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('review_url', pr.html_url);

  # 第一层：安全扫描
  security-scan:
    needs: review-context
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.review-context.outputs.head-sha }}
          fetch-depth: 0  # 需要完整历史做 diff

      - name: Security Scan - Secrets
        id: secrets-scan
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          
          # 获取 PR 的 diff
          git fetch origin ${{ needs.review-context.outputs.base-ref }}:${{ needs.review-context.outputs.base-ref }}
          DIFF=$(git diff ${{ needs.review-context.outputs.base-ref }}...HEAD)
          
          # 检查硬编码密钥
          echo "$DIFF" | grep "^+" | grep -iE "(api_key|secret|password|token|passwd|private_key)\s*[=:]\s*['\"][^'\"]{8,}['\"]" > /tmp/secrets_found.txt || true
          
          if [ -s /tmp/secrets_found.txt ]; then
            echo "❌ Hardcoded secrets detected!"
            cat /tmp/secrets_found.txt
            echo "secrets_found=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
            echo "secrets_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Security Scan - Dangerous Functions
        id: danger-scan
        run: |
          echo "🔍 Scanning for dangerous functions..."
          
          git fetch origin ${{ needs.review-context.outputs.base-ref }}:${{ needs.review-context.outputs.base-ref }}
          DIFF=$(git diff ${{ needs.review-context.outputs.base-ref }}...HEAD)
          
          # Python 危险函数
          echo "$DIFF" | grep "^+" | grep -E "\beval\(|\bexec\(|\bos\.system\(|subprocess\.call\(.*shell=True|subprocess\.run\(.*shell=True|pickle\.loads?\(" > /tmp/danger_found.txt || true
          
          # SQL 注入检查
          echo "$DIFF" | grep "^+" | grep -E "execute\(f\"|\.format\(.*SELECT|\.format\(.*INSERT|\.format\(.*DELETE" >> /tmp/danger_found.txt || true
          
          if [ -s /tmp/danger_found.txt ]; then
            echo "⚠️ Potentially dangerous patterns found:"
            cat /tmp/danger_found.txt
            echo "danger_found=true" >> "$GITHUB_OUTPUT"
            # 不直接失败，只警告，由 reviewer 判断
          else
            echo "✅ No dangerous patterns found"
            echo "danger_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Security Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const secretsFound = '${{ steps.secrets-scan.outputs.secrets_found }}' === 'true';
            const dangerFound = '${{ steps.danger-scan.outputs.danger_found }}' === 'true';
            
            const marker = '<!-- codex-review:security-scan -->';
            let body = `${marker}\n## 🔒 Security Scan Results\n\n`;
            
            if (secretsFound) {
              body += '❌ **FAIL**: Hardcoded secrets detected! Please use environment variables or secret management.\n';
            } else {
              body += '✅ **PASS**: No hardcoded secrets found.\n';
            }
            
            if (dangerFound) {
              body += '⚠️ **WARNING**: Potentially dangerous function calls found. Please review manually.\n';
            } else {
              body += '✅ **PASS**: No dangerous patterns found.\n';
            }
            
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: Number('${{ needs.review-context.outputs.pr-number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: Number('${{ needs.review-context.outputs.pr-number }}'),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # 第二层：代码质量检查（快速）
  quality-check:
    runs-on: ubuntu-latest
    needs: [review-context, security-scan]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.review-context.outputs.head-sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra all --frozen

      - name: Run ruff (lint)
        id: lint
        run: |
          source .venv/bin/activate
          set +e
          ruff check dimos/ tests/ scripts/ --output-format=github > /tmp/lint_results.txt 2>&1
          status=$?
          set -e
          cat /tmp/lint_results.txt
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

      - name: Run ruff (format check)
        id: format
        run: |
          source .venv/bin/activate
          set +e
          ruff format --check dimos/ tests/ scripts/ > /tmp/format_results.txt 2>&1
          status=$?
          set -e
          cat /tmp/format_results.txt
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

      - name: Type check (mypy)
        id: typecheck
        continue-on-error: true  # mypy 可能有很多历史问题，不阻塞
        run: |
          source .venv/bin/activate
          mypy dimos --ignore-missing-imports > /tmp/mypy_results.txt 2>&1 || true
          cat /tmp/mypy_results.txt

      - name: Post Quality Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const marker = '<!-- codex-review:quality-check -->';
            let body = `${marker}\n## 📊 Code Quality Check\n\n`;
            
            // Lint results
            const lintResults = fs.readFileSync('/tmp/lint_results.txt', 'utf8');
            const lintErrors = lintResults.split('\n').filter(line => line.includes('error')).length;
            if (lintErrors > 0) {
              body += `⚠️ **Lint**: ${lintErrors} issues found\n\n<details><summary>Details</summary>\n\n\`\`\`\n${lintResults}\n\`\`\`\n</details>\n\n`;
            } else {
              body += '✅ **Lint**: Clean\n';
            }
            
            // Format results
            const formatResults = fs.readFileSync('/tmp/format_results.txt', 'utf8');
            if (formatResults.includes('would reformat')) {
              body += '⚠️ **Format**: Files need formatting. Run `ruff format .`\n';
            } else {
              body += '✅ **Format**: Clean\n';
            }
            
            body += '\n---\n*This is an automated check. Please review and fix issues before merging.*';
            
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: Number('${{ needs.review-context.outputs.pr-number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: Number('${{ needs.review-context.outputs.pr-number }}'),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail on quality issues
        if: steps.lint.outputs.exit_code != '0' || steps.format.outputs.exit_code != '0'
        run: |
          echo "Lint or format issues found. See the Code Quality Check comment for details."
          exit 1

  # 第三层：触发 Hermes Review
  trigger-hermes-review:
    runs-on: ubuntu-latest
    needs: [review-context, security-scan, quality-check]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.review-context.result == 'success'
    env:
      HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.review-context.outputs.head-sha }}
          fetch-depth: 0

      - name: Prepare Review Payload
        id: prepare
        run: |
          # 获取 PR diff
          git fetch origin ${{ needs.review-context.outputs.base-ref }}:${{ needs.review-context.outputs.base-ref }}
          git diff ${{ needs.review-context.outputs.base-ref }}...HEAD > /tmp/pr_diff.txt
          
          # 获取变更的文件列表
          git diff --name-only ${{ needs.review-context.outputs.base-ref }}...HEAD > /tmp/changed_files.txt
          
          # 统计信息
          echo "Changed files:"
          cat /tmp/changed_files.txt
          echo ""
          echo "Diff stats:"
          git diff --stat ${{ needs.review-context.outputs.base-ref }}...HEAD
          
          # 准备 JSON payload
          cat > /tmp/review_payload.json << 'EOF'
          {
            "event": "codex_review_request",
            "repository": "${{ github.repository }}",
            "pr_number": ${{ needs.review-context.outputs.pr-number }},
            "branch": "${{ needs.review-context.outputs.head-ref }}",
            "base_branch": "${{ needs.review-context.outputs.base-ref }}",
            "commit_sha": "${{ needs.review-context.outputs.head-sha }}",
            "actor": "${{ github.actor }}",
            "security_scan_status": "${{ needs.security-scan.result }}",
            "quality_check_status": "${{ needs.quality-check.result }}",
            "review_url": "${{ needs.review-context.outputs.review-url }}"
          }
          EOF
          
          echo "Payload prepared:"
          cat /tmp/review_payload.json

      - name: Trigger Hermes Review (if configured)
        if: env.HERMES_WEBHOOK_URL != ''
        run: |
          echo "🚀 Triggering Hermes Review..."
          curl -X POST "$HERMES_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/review_payload.json \
            --max-time 10 \
            -v || echo "Hermes webhook not configured or unreachable"

      - name: Post Review Trigger Status
        if: always()
        uses: actions/github-script@v7
        env:
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
        with:
          script: |
            const hermesConfigured = process.env.HERMES_WEBHOOK_URL !== '';
            
            const marker = '<!-- codex-review:hermes-status -->';
            let body = `${marker}\n## 🤖 Hermes Review Status\n\n`;
            
            if (hermesConfigured) {
              body += '✅ Hermes Review triggered.\n';
              body += 'A separate review agent will analyze this PR for logic errors and architecture issues.\n';
            } else {
              body += 'ℹ️ Hermes Review not configured.\n';
              body += 'To enable: Set `HERMES_WEBHOOK_URL` secret in repository settings.\n';
            }
            
            body += '\n---\n';
            body += '**Pipeline Status**:\n';
            body += '- Security Scan: ${{ needs.security-scan.result }}\n';
            body += '- Quality Check: ${{ needs.quality-check.result }}\n';
            
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: Number('${{ needs.review-context.outputs.pr-number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: Number('${{ needs.review-context.outputs.pr-number }}'),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
